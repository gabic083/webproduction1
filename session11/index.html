<!DOCTYPE html>
<html lang="en">

<head>
    <title>The Little Library</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
</head>

<body>

    <div id="page">

        <h1>The Little Library</h1>
        <p class="subtitle">Select a book and bring it to the reading table.</p>

        <!-- Left bookshelf -->
        <div id="left-container" class="container">

            <div class="book-holder">
                <img class="book" id="book1" src="./images/book1.png" alt="Book 1" />
            </div>

            <div class="book-holder">
                <img class="book" id="book2" src="./images/book2.png" alt="Book 2" />
            </div>

            <div class="book-holder">
                <img class="book" id="book3" src="./images/book3.png" alt="Book 3" />
            </div>

            <div class="book-holder">
                <img class="book" id="book4" src="./images/book4.png" alt="Book 4" />
            </div>

            <div class="book-holder">
                <img class="book" id="book5" src="./images/book5.png" alt="Book 5" />
            </div>

            <div class="book-holder">
                <img class="book" id="book6" src="./images/book6.png" alt="Book 6" />
            </div>

            <div class="book-holder">
                <img class="book" id="book7" src="./images/book7.png" alt="Book 7" />
            </div>

        </div>

        <!-- Right bookshelf -->
        <div id="right-container" class="container">

            <div class="book-holder">
                <img class="book" id="book8" src="./images/book8.png" alt="Book 8" />
            </div>

            <div class="book-holder">
                <img class="book" id="book9" src="./images/book9.png" alt="Book 9" />
            </div>

            <div class="book-holder">
                <img class="book" id="book10" src="./images/book10.png" alt="Book 10" />
            </div>

            <div class="book-holder">
                <img class="book" id="book11" src="./images/book11.png" alt="Book 11" />
            </div>

            <div class="book-holder">
                <img class="book" id="book12" src="./images/book12.png" alt="Book 12" />
            </div>

            <div class="book-holder">
                <img class="book" id="book13" src="./images/book13.png" alt="Book 13" />
            </div>

            <div class="book-holder">
                <img class="book" id="book14" src="./images/book14.png" alt="Book 14" />
            </div>

        </div>

        <img src="./images/fireplace.png" id="fireplace" alt="Wooden fireplace">

        <!-- Reading table -->
        <div id="reading-table">
            <h2>Reading Table</h2>
        </div>

    </div>

</body>
</html>
